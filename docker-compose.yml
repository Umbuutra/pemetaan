name: pemetaan

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pemetaan-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - pemetaan-net

  web:
    image: nginx:alpine
    container_name: pemetaan-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pemetaan-net

  db:
    image: mysql:8.0
    container_name: pemetaan-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pemetaan}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-12345678}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-12345678}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - pemetaan-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pemetaan-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-12345678}
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - pemetaan-net

volumes:
  dbdata:

networks:
  pemetaan-net:
    driver: bridge
